# Builds the invitation and publishes it to GitHub Pages on every change to main.
# Her değişiklikte davetiyeyi derleyip GitHub Pages'te yayınlar.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # If this step fails, open it: the error explains what to fix in invitation.yaml.
      # Bu adım kırmızı olursa tıklayın: invitation.yaml'da neyin düzeltileceği yazar.
      - name: Build (reads invitation.yaml)
        run: npm run build
        env:
          # Custom domain or <user>.github.io repo → "/", otherwise "/<repo-name>/"
          BASE_PATH: ${{ (endsWith(github.repository, '.github.io') || vars.CUSTOM_DOMAIN == 'true') && '/' || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
